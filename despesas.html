<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Despesas</title>
    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="footer.css">
    <script src="/js/navbar.js" defer></script>

    <style>
    
    body{
        font-family: 'Roboto', sans-serif;
        font-size: 20px;
    }
    .conteiner{
        display: flex;
        gap: 10%;
        justify-content: center;
        align-items: center;
        
    }
                   
    .box {
        display: flex;
        flex-direction: column;
        align-items: center;
        border: solid 1px rgba(0,0,0,0.2);
        border-radius: 5px;
        margin: 10px;
        padding: 20px;
    }

    .box h2 {
        margin-bottom: 20px;
        text-align: center;
    }

    .box label {
        width: 300px;
        margin: 10px 0 5px;
        font-size: 16px;
        font-weight: 500;
    }

    .box input {
        width: 300px;
        height: 30px;
        border: solid 1px rgba(0,0,0,0.2);
        border-radius: 5px;
        padding: 0 10px;
        box-sizing: border-box;
    }

    .box button {
        width: 300px;
        height: 40px;
        border: none;
        background-color: #2067b3;
        color: white;
        border-radius: 5px;
        margin-top: 20px;
    }

    @media (max-width: 768px) {
        .conteiner{
            display: flex;
            flex-direction: column;
            gap: 10%;
            justify-content: center;
            align-items: center;
            
            
        }
        
    }

    </style>


</head>
<body>
    

    <nav class="navbar" id="navbar">
        <button class="menu-toggle" aria-label="Abrir menu"> ☰</button>
        <ul class="menu">
            <li><a href="dashboard.html">dashboard</a></li>
            <li><a href="despesas.html">Despesas</a></li>
            <li><a href="relatorios.html">resumo</a></li>
            <li class="Account"><a href="conta.html">conta</a></li>
        </ul>
    </nav>

    <div class="conteiner">
        <div id="veiculo" class="box">
            <h2>veiculo</h2>

            <label for="identVeiculo">Identificação</label>
            <input id="identVeiculo" type="text" placeholder="gasolina, revisão, manutenção, etc...">

            <label for="valorVeiculo">Valor</label>
            <input id="valorVeiculo" type="number" placeholder="R$0,00">

            <button id="btnVeiculo">salvar</button>
        </div>

        <div id="pessoal" class="box">
            <h2>pessoal</h2>

            <label for="identPessoal">Identificação</label>
            <input id="identPessoal" type="text" placeholder="aluguel, energia, agua, etc">

            <label for="valorPessoal">Valor</label>
            <input id="valorPessoal" type="number"  placeholder="R$ 0,00">

            <button id="btnPessoal">salvar</button>

        </div>
    </div>
    
   
    <script type="module" src="js/despesas.js" defer></script>
    <script type="module" src="/js/conta.js" defer></script>   
    <script type="module" src="/js/span.js" defer></script>

    <footer class="footer">
        <p>© <span id="spanAno"></span> - Driver finanças - <span id="spanversão"></span><br>
         Todos os direitos reservados</p>
    </footer>
    

</body>


</html>
