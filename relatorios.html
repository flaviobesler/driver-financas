    <link rel="stylesheet" href="navbar.css">

    <style>
        tr {
        page-break-inside: avoid;
        }

        table {
        page-break-after: auto;
        page-break-before: auto;
}
        .conteiner{
            margin-top: 20px;
            font-family: 'roboto', sans-serif;
        }
        
        .extrato{
            border: 1px solid rgba(0,0,0,0.2);
            border-radius: 5px;
            box-sizing: border-box;
            margin-bottom: 20px;
            
        }

        .extrato ul{
            list-style: none; 
            margin-right: 20px;
        }
        
        .extrato li{
            font-size: 25px;
        }
        .extrato select{
        width: 250px;
        min-height: 30px;
        border: 1px solid rgba(0,0,0,0.2);
        border-radius: 5px;    
        }
        .extrato button{
            margin-top: 15px;
           
            margin-bottom: 10px;
            background-color: #6191c5;;
            width: 121px;
            min-height: 30px;
            border: none;
            border-radius: 5px;
            font-size: 15px;
            color: white;
        }

        .titulo-interno{
        margin-right: 20px;}

        .tabela{
            width: 100%;
            margin-right: 20px;
            border: 1px solid rgba(0,0,0,0.2);
            box-sizing: border-box;
            border-collapse: collapse;
            width: 100%;
            justify-items: center;
            text-align: center;
            }
        #relatoriopdf {
        display: block !important;
        }

        .co-esq{
            justify-content: left;
        
        }

       

        
        
    
    @media (min-width:900px) {
        .conteiner{
            margin-top: 20px;
            display: flex;
            font-family: 'Roboto', sans-serif;
            align-items: flex-start;
            }
        .tabela{
            
            margin-left: 20px;
            margin-right: 20px;
            border: 1px solid rgba(0,0,0,0.2);
            
            
            }
        .tabela td{

            padding-left: 80px;
            padding-right: 80px;}
        

    }

    @media (max-width:900px) {
        .tabela td{

            padding-left: 40px;
            padding-right: 40px;}
        

    
        
    }


    </style>





</head>
