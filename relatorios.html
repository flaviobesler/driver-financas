<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>relatorios</title>
    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="footer.css">
    <script src="/js/navbar.js" defer></script>
    <style>
        body{
            font-size: 20px;
            font-family: 'roboto', sans-serif;
        }
        .relatorio{
            display: flex;
            flex-direction: column;
            margin-left: 10px;
            margin-top: 10px;
        }
        .relatorio button, .relatorio button a{
            text-decoration: none;
            width: 300px;
            min-height: 35px;
            font-size: 15px;
            border: none;
            background-color: #6191c5;
            border-radius: 5px;
            color: white;
            margin-top: 10px;
        }
        .relatorio select{
            width: 300px;    
            min-height: 30px;
            font-size: 15px;
            border-radius: 5px;
            margin-top: 10px;
            margin-bottom: 10px;
        }
        
        


        @media (min-width: 800px) {
        .mobile{
        display: none;}
        .conteiner{
        display: flex;}
        .tabela th,
        .tabela td{
            padding: 10px 70px;
        }
        tbody button{
            width: 80px;
            min-height: 35px;
            font-size: 15px;
            border: none;
            background-color: #6191c5;
            border-radius: 5px;
            color: white;}
       
            
        }/*fim desktop*/

        @media (max-width: 800px) {
            .desktop{
            display: none;
            }

            .lista dl{
            margin: 20px;
            text-align: center;}

            .listas{
            display: flex;
            }

            .lista dt, .lista dd{
            flex-direction: column;
            margin: 0px;
            margin-top: 10px;
            }
            .lista button{
                width: 300px;
                min-height: 35px;
                font-size: 15px;
                border: none;
                background-color: #6191c5;
                border-radius: 5px;
                color: white;}
            dt{
            font-weight: bold;
            }
            
        }/*fim celular*/

    </style>
</head>
<body>
    <nav class="navbar" id="navbar">
        <button class="menu-toggle" aria-label="Abrir menu"> ☰</button>
        <ul class="menu">
            <li><a href="dashboard.html">dashboard</a></li>
            <li><a href="despesas.html">Despesas</a></li>
            <li><a href="relatorios.html">relatorios</a></li>
            <li class="Account"><a href="conta.html">conta</a></li>
        </ul>
    </nav>

    <div class="conteiner">
        <div>
            <div class="relatorio">
                <h2>despesas</h2>
                intervalo
                <select id="selectDespesas">
                    <option value="1">30 dias</option>
                    <option value="2">60 dias</option>
                    <option value="3">90 dias</option>
                    <option value="6" selected>180 dias</option>
                   
                </select>
                <button id="btnDespesas">gerar relatorio</button>
                <button id="PDFDespesas" > <a href="pdfdespesa.html">gerar pdf</a></button>
            </div>
            <div class="relatorio">
                <h2>lucros</h2>
                intervalo
                <select id="selectLucros">
                    <option value="1">30 dias</option>
                    <option value="2">60 dias</option>
                    <option value="3">90 dias</option>
                    <option value="6">180 dias</option>
                   
                </select>
                <button id="btnLucros">gerar relatorio</button>
                <button id="PDFLucros">gerar pdf</button>
            </div>
        </div>
        <div class="desktop">
            <table class="tabela">
                <thead>
                    <tr>
                        <th>despesa</th>
                        <th>valor</th>
                        <th>parcela</th>
                        <th>data</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="tbody">

                </tbody>
            </table>
        </div>

    </div>
    <div class="mobile">
        <div class="lista" id="lista"></div>
    </div>
    





<script type="module" src="/js/relatorios.js" defer></script>

</body>
</html>
